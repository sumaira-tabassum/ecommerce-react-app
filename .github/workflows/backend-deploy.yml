name: Backend Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Required so GitHub exposes Environment secrets (AWS_*, ECR_*, EC2_*).
    environment: Production

    steps:
      # =========================
      # CHECKOUT
      # =========================
      - name: Checkout code
        uses: actions/checkout@v3

      # =========================
      # SETUP NODE
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # =========================
      # INSTALL DEPENDENCIES
      # =========================
      - name: Install dependencies
        working-directory: ./backend
        run: npm install

      # =========================
      # CODE QUALITY CHECK
      # =========================
      - name: Run ESLint
        working-directory: ./backend
        run: npm run lint

      # =========================
      # CONFIGURE AWS
      # Requires repo secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY (IAM user keys with ECR push, etc.)
      # =========================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # =========================
      # LOGIN TO ECR
      # =========================
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      # =========================
      # BUILD IMAGE
      # =========================
      - name: Build Docker image
        run: |
          docker build -t backend-app ./backend
          docker tag backend-app:latest ${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}

      # =========================
      # PUSH IMAGE
      # =========================
      - name: Push image to ECR
        run: |
          docker push ${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}

      # =========================
      # DEPLOY TO EC2
      # The image excludes .env (see backend/.dockerignore). Runtime config must be injected here.
      # On the EC2 host, keep a real .env at: $HOME/ecommerce-react-app/backend/.env
      # (same keys as backend/.env.example). Optional GitHub secret EC2_BACKEND_ENV_FILE overrides the path.
      # =========================
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region eu-north-1 | sudo docker login --username AWS --password-stdin 058264432829.dkr.ecr.eu-north-1.amazonaws.com

            sudo docker stop backend-container || true
            sudo docker rm backend-container || true

            # Another container (or a previous deploy under a different name) may still bind host :80.
            sudo docker ps -q --filter publish=80 | xargs -r sudo docker stop || true

            sudo docker pull ${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}

            ENV_FILE="${{ secrets.EC2_BACKEND_ENV_FILE }}"
            if [ -z "$ENV_FILE" ]; then ENV_FILE="$HOME/ecommerce-react-app/backend/.env"; fi
            if [ ! -f "$ENV_FILE" ]; then
              echo "Missing env file: $ENV_FILE" >&2
              echo "Create it on EC2 with JWT_SECRET, MONGO_URI, CLOUD_*, EMAILJS_*, etc. (see backend/.env.example)." >&2
              exit 1
            fi

            sudo docker run -d \
              --name backend-container \
              -p 80:3000 \
              --restart always \
              --env-file "$ENV_FILE" \
              ${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}

      # =========================
      # HEALTH CHECK (via SSH — same path as browsers: http://<host>/… with no port in the URL)
      # =========================
      - name: Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          script: |
            i=0
            while [ "$i" -lt 12 ]; do
              if curl --fail -sS --max-time 10 http://127.0.0.1/health; then
                exit 0
              fi
              i=$((i + 1))
              sleep 5
            done
            echo "Health check failed after retries"
            exit 1