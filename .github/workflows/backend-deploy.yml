name: Backend Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # CHECKOUT
      # =========================
      - name: Checkout code
        uses: actions/checkout@v3

      # =========================
      # SETUP NODE
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # =========================
      # INSTALL DEPENDENCIES
      # =========================
      - name: Install dependencies
        working-directory: ./backend
        run: npm install

      # =========================
      # CODE QUALITY CHECK
      # =========================
      - name: Run ESLint
        working-directory: ./backend
        run: npm run lint

      # =========================
      # RUN TESTS
      # =========================
      - name: Run Tests
        working-directory: ./backend
        run: npm test

      # =========================
      # CONFIGURE AWS
      # =========================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REIGON }}

      # =========================
      # LOGIN TO ECR
      # =========================
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      # =========================
      # BUILD IMAGE
      # =========================
      - name: Build Docker image
        run: |
          docker build -t backend-app ./backend
          docker tag backend-app:latest ${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}

      # =========================
      # PUSH IMAGE
      # =========================
      - name: Push image to ECR
        run: |
          docker push ${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}

      # =========================
      # DEPLOY TO EC2
      # =========================
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin 058264432829.dkr.ecr.eu-north-1.amazonaws.com

            docker stop backend-container || true
            docker rm backend-container || true

            docker pull ${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}

            docker run -d \
              --name backend-container \
              -p 3000:3000 \
              --restart always \
              ${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}

      # =========================
      # HEALTH CHECK
      # =========================
      - name: Health Check
        run: |
          sleep 15
          curl --fail http://${{ secrets.EC2_HOST }}/health