name: Full Stack Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/backend-deploy.yml'

  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    # Required so GitHub exposes Environment secrets
    environment: Production

    permissions:
      contents: read

    steps:
      # =========================
      # CHECKOUT
      # =========================
      - name: Checkout code
        uses: actions/checkout@v4

      # =========================
      # SETUP NODE
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # =========================
      # INSTALL DEPENDENCIES
      # =========================
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      # =========================
      # CODE QUALITY CHECK
      # =========================
      - name: Run ESLint
        working-directory: ./backend
        run: npm run lint

      # =========================
      # CONFIGURE AWS
      # =========================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # =========================
      # LOGIN TO ECR
      # =========================
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # =========================
      # BUILD IMAGE
      # =========================
      - name: Build Docker image
        run: |
          docker build -t backend-app ./backend
          docker tag backend-app:latest ${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}

      # =========================
      # PUSH IMAGE
      # =========================
      - name: Push image to ECR
        run: |
          docker push ${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}

      # =========================
      # DEPLOY TO EC2
      # =========================
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | sudo docker login --username AWS --password-stdin 058264432829.dkr.ecr.eu-north-1.amazonaws.com

            sudo docker stop backend-container || true
            sudo docker rm backend-container || true

            # Stop anything else using port 80
            sudo docker ps -q --filter publish=80 | xargs -r sudo docker stop || true

            sudo docker pull ${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}

            ENV_FILE="${{ secrets.EC2_BACKEND_ENV_FILE }}"

            if [ -z "$ENV_FILE" ]; then
              ENV_FILE="$HOME/ecommerce-react-app/backend/.env"
            fi

            if [ ! -f "$ENV_FILE" ]; then
              echo "Missing env file: $ENV_FILE" >&2
              exit 1
            fi

            sudo docker run -d \
              --name backend-container \
              -p 80:3000 \
              --restart always \
              --env-file "$ENV_FILE" \
              ${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}

      # =========================
      # HEALTH CHECK
      # =========================
      - name: Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          script: |
            i=0

            while [ "$i" -lt 12 ]; do
              if curl --fail -sS --max-time 10 http://127.0.0.1/health; then
                exit 0
              fi

              i=$((i + 1))
              sleep 5
            done

            echo "Health check failed after retries"
            exit 1

  deploy-frontend:
    runs-on: ubuntu-latest

    environment: Production

    permissions:
      contents: read

    env:
      BUCKET_NAME: ${{ secrets.FRONTEND_S3_BUCKET }}

    steps:
      # =========================
      # CHECKOUT
      # =========================
      - name: Checkout code
        uses: actions/checkout@v4

      # =========================
      # SETUP NODE
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # =========================
      # INSTALL DEPENDENCIES
      # =========================
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      # =========================
      # BUILD FRONTEND
      # =========================
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}

      # =========================
      # CONFIGURE AWS
      # =========================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # =========================
      # DEPLOY TO S3
      # =========================
      - name: Upload frontend to S3
        run: |
          aws s3 sync ./frontend/dist s3://$BUCKET_NAME --delete